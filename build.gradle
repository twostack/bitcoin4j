plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'org.twostack'
version = '1.8.0'

repositories {
    mavenCentral()
}

compileJava {
    options.encoding = "UTF-8"
}

javadoc {
    options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withJavadocJar()
    withSourcesJar()
}

dependencies {
    api 'org.bouncycastle:bcprov-jdk15to18:1.68'
    api 'com.google.guava:guava:30.0-android'
    implementation 'org.slf4j:slf4j-api:1.7.30'
    implementation 'net.jcip:jcip-annotations:1.0'
    implementation 'at.favre.lib:bytes:1.5.0'
    testImplementation 'junit:junit:4.13.1'
    testImplementation 'org.easymock:easymock:3.2'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.5.2'
    testImplementation 'org.slf4j:slf4j-jdk14:1.7.30'
    testImplementation group: 'org.assertj', name: 'assertj-core', version: '3.19.0'
    testImplementation 'org.hamcrest:hamcrest-library:1.3'
}


publishing {

    repositories {
        maven {
            url = "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
            name = "CentralPortal"
            credentials {
                username = findProperty('centralPortalUsername') ?: ''
                password = findProperty('centralPortalPassword') ?: ''
            }
        }
    }
    publications {
        maven(MavenPublication) {
            groupId = 'org.twostack'
            artifactId = 'bitcoin4j'
            version = version

            from components.java

            pom {

                name = 'Bitcoin4J'
                packaging = 'jar'
                description = 'A native Java Bitcoin library. Specifically targeted at BitcoinSV (BSV).'
                url = 'https://twostack.org'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'stephanfeb'
                        name = 'Stephan M. February'
                        email = 'stephan@twostack.org'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/twostack/bitcoin4j.git'
                    developerConnection = 'scm:git:ssh://github.com:twostack/bitcoin4j.git'
                    url = 'https://github.com/twostack/bitcoin4j'
                }
            }
        }

    }
}

signing {
    // Only sign when actually publishing to a remote repository, so that a clean
    // checkout can build/test (and publishToMavenLocal) without a GPG key.
    required = { gradle.taskGraph.allTasks.any { it.name.startsWith('publish') && !it.name.contains('MavenLocal') } }
    sign publishing.publications.maven
}


/*
 * Releasing to Maven Central (Sonatype Central Portal, via the OSSRH Staging API):
 *
 *   ./gradlew publishToCentralPortal
 *
 * Credentials (a Central Portal *user token*, not your login) and signing config go in ~/.gradle/gradle.properties:
 *   centralPortalUsername, centralPortalPassword, signing.keyId, signing.password, signing.secretKeyRingFile
 *
 * Uploading to the staging endpoint alone is not enough: the staging repository must then be handed over
 * to the Central Portal, which is what this task does after publishing. By default the deployment is left
 * for you to review and release at https://central.sonatype.com/publishing/deployments. Pass
 * -PcentralPublishingType=automatic to release it as soon as validation passes.
 */
tasks.register('publishToCentralPortal') {
    group = 'publishing'
    description = 'Publishes to the OSSRH Staging API and transfers the deployment to the Central Portal.'
    dependsOn 'publishMavenPublicationToCentralPortalRepository'

    doLast {
        def username = findProperty('centralPortalUsername')
        def password = findProperty('centralPortalPassword')
        if (!username || !password) {
            throw new GradleException('centralPortalUsername / centralPortalPassword are not set')
        }

        def publishingType = findProperty('centralPublishingType') ?: 'user_managed'
        def token = "${username}:${password}".bytes.encodeBase64().toString()
        def url = new URL("https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/${project.group}?publishing_type=${publishingType}")

        def connection = (HttpURLConnection) url.openConnection()
        connection.requestMethod = 'POST'
        connection.setRequestProperty('Authorization', "Bearer ${token}")
        connection.doOutput = true
        connection.outputStream.close()

        def status = connection.responseCode
        def body = (status < 400 ? connection.inputStream : connection.errorStream)?.text
        if (status < 200 || status >= 300) {
            throw new GradleException("Central Portal transfer failed (HTTP ${status}): ${body}")
        }
        logger.lifecycle("Transferred ${project.group}:${project.name}:${project.version} to the Central Portal (${publishingType}).")
        logger.lifecycle('Check its status at https://central.sonatype.com/publishing/deployments')
    }
}

javadoc {
    if(JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}

